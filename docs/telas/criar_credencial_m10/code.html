<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#581e00",
                    "secondary": "#4edea3",
                    "outline": "#8d90a0",
                    "on-secondary-fixed": "#002113",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface-container-lowest": "#060e20",
                    "on-secondary-fixed-variant": "#005236",
                    "info-cyan": "#06B6D4",
                    "on-tertiary-fixed": "#360f00",
                    "surface-container": "#171f33",
                    "on-secondary-container": "#00311f",
                    "outline-variant": "#434655",
                    "tertiary-fixed": "#ffdbcd",
                    "surface-tint": "#b4c5ff",
                    "secondary-fixed-dim": "#4edea3",
                    "on-primary-fixed": "#00174b",
                    "on-primary-fixed-variant": "#003ea8",
                    "slate-surface": "#1E293B",
                    "graphite-deep": "#020617",
                    "surface-dim": "#0b1326",
                    "on-surface": "#dae2fd",
                    "on-background": "#dae2fd",
                    "warning-amber": "#F59E0B",
                    "surface-bright": "#31394d",
                    "on-error": "#690005",
                    "primary-fixed-dim": "#b4c5ff",
                    "inverse-on-surface": "#283044",
                    "danger-red": "#EF4444",
                    "surface-container-highest": "#2d3449",
                    "tertiary": "#ffb596",
                    "surface-container-high": "#222a3d",
                    "error-container": "#93000a",
                    "tertiary-container": "#bc4800",
                    "secondary-container": "#00a572",
                    "inverse-surface": "#dae2fd",
                    "secondary-fixed": "#6ffbbe",
                    "background": "#0b1326",
                    "on-secondary": "#003824",
                    "surface-container-low": "#131b2e",
                    "on-tertiary-container": "#ffede6",
                    "primary": "#b4c5ff",
                    "on-surface-variant": "#c3c6d7",
                    "surface-variant": "#2d3449",
                    "on-primary": "#002a78",
                    "on-primary-container": "#eeefff",
                    "on-error-container": "#ffdad6",
                    "primary-fixed": "#dbe1ff",
                    "error": "#ffb4ab",
                    "surface": "#0b1326",
                    "inverse-primary": "#0053db",
                    "primary-container": "#2563eb",
                    "on-tertiary-fixed-variant": "#7d2d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "max-width": "1280px",
                    "margin-desktop": "32px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-md": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],

      }

<style>
        body {
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .input-focus-ring:focus-within {
            outline: 2px solid theme('colors.primary');
            outline-offset: -2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full bg-surface dark:bg-surface border-b border-outline-variant sticky top-0 z-50">
<div class="flex items-center gap-4">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Nova Credencial</h1>
</div>
<div class="flex items-center gap-2">
<button class="px-4 py-2 font-label-caps text-label-caps text-primary hover:bg-surface-variant rounded-full transition-colors active:opacity-80">
                Salvar
            </button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto w-full max-w-screen-md mx-auto px-margin-mobile py-8 pb-32">
<div class="space-y-8">
<!-- Icon/Visual Header -->
<div class="flex flex-col items-center justify-center py-6 gap-4">
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-[40px] text-primary">key</span>
</div>
<p class="text-on-surface-variant font-body-sm text-center">Insira os detalhes da nova credencial para armazená-la no seu cofre seguro.</p>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Label + Field: Usuário -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="username">USUÁRIO / E-MAIL</label>
<div class="input-focus-ring group relative flex items-center bg-surface-container rounded-xl border border-outline-variant transition-all overflow-hidden">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">person</span>
<input class="w-full h-14 bg-transparent pl-12 pr-4 border-none focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-lg" id="username" placeholder="exemplo@email.com" type="text"/>
</div>
</div>
<!-- Label + Field: Senha -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="password">SENHA</label>
<div class="input-focus-ring group relative flex items-center bg-surface-container rounded-xl border border-outline-variant transition-all overflow-hidden">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">lock</span>
<input class="w-full h-14 bg-transparent pl-12 pr-28 border-none focus:ring-0 text-on-surface placeholder:text-outline/50 font-mono-data text-mono-data" id="password" placeholder="Sua senha segura" type="password"/>
<div class="absolute right-2 flex items-center gap-1">
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors active:scale-90" onclick="togglePasswordVisibility()" title="Ver senha">
<span class="material-symbols-outlined" id="visibility_icon">visibility_off</span>
</button>
<div class="w-px h-6 bg-outline-variant"></div>
<button class="px-3 py-1.5 font-label-caps text-label-caps text-primary hover:bg-primary/10 rounded-lg transition-colors active:scale-95">
                                GERAR
                            </button>
</div>
</div>
<!-- Password Strength Indicator (Subtle UI enhancement) -->
<div class="flex gap-1 h-1 px-1">
<div class="flex-1 rounded-full bg-outline-variant"></div>
<div class="flex-1 rounded-full bg-outline-variant"></div>
<div class="flex-1 rounded-full bg-outline-variant"></div>
<div class="flex-1 rounded-full bg-outline-variant"></div>
</div>
</div>
<!-- Label + Field: Observações -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="notes">OBSERVAÇÕES (OPCIONAL)</label>
<div class="input-focus-ring group relative bg-surface-container rounded-xl border border-outline-variant transition-all overflow-hidden">
<textarea class="w-full p-4 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-lg resize-none" id="notes" placeholder="Adicione detalhes extras aqui..." rows="4"></textarea>
</div>
</div>
</div>
<!-- Secondary Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full h-14 bg-primary text-on-primary font-label-caps text-label-caps rounded-xl flex items-center justify-center gap-2 hover:opacity-90 transition-all active:scale-95 shadow-lg">
<span class="material-symbols-outlined">save</span>
                    SALVAR CREDENCIAL
                </button>
<button class="w-full h-12 text-danger-red font-label-caps text-label-caps border border-danger-red/30 rounded-xl flex items-center justify-center gap-2 hover:bg-danger-red/5 transition-all active:scale-95">
<span class="material-symbols-outlined">cancel</span>
                    CANCELAR
                </button>
</div>
</div>
</main>
<!-- Visual Polish: Soft Glow background effect -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] bg-primary/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibility_icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility_off';
            }
        }

        // Ripple Effect on buttons (Simple interaction logic)
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function (e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.width = '1px';
                ripple.style.height = '1px';
                ripple.style.background = 'rgba(255, 255, 255, 0.3)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.top = `${y}px`;
                ripple.style.left = `${x}px`;
                
                this.style.position = 'relative';
                this.style.overflow = 'hidden';
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
</body></html>
