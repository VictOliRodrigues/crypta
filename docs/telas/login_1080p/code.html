<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Sentinela</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#0b1326",
                    "secondary-fixed-dim": "#4edea3",
                    "surface-container-highest": "#2d3449",
                    "on-secondary-container": "#00311f",
                    "on-tertiary": "#581e00",
                    "on-surface": "#dae2fd",
                    "outline-variant": "#434655",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface-container": "#171f33",
                    "graphite-deep": "#020617",
                    "primary-fixed": "#dbe1ff",
                    "primary-container": "#2563eb",
                    "surface-tint": "#b4c5ff",
                    "on-surface-variant": "#c3c6d7",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "surface-container-low": "#131b2e",
                    "slate-surface": "#1E293B",
                    "primary": "#b4c5ff",
                    "inverse-primary": "#0053db",
                    "background": "#0b1326",
                    "tertiary-container": "#bc4800",
                    "surface-container-lowest": "#060e20",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-container": "#ffede6",
                    "error-container": "#93000a",
                    "on-primary": "#002a78",
                    "on-primary-container": "#eeefff",
                    "secondary-fixed": "#6ffbbe",
                    "on-background": "#dae2fd",
                    "secondary-container": "#00a572",
                    "tertiary-fixed": "#ffdbcd",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-tertiary-fixed": "#360f00",
                    "inverse-surface": "#dae2fd",
                    "on-error": "#690005",
                    "primary-fixed-dim": "#b4c5ff",
                    "surface-dim": "#0b1326",
                    "secondary": "#4edea3",
                    "danger-red": "#EF4444",
                    "surface-bright": "#31394d",
                    "on-secondary-fixed": "#002113",
                    "on-primary-fixed": "#00174b",
                    "tertiary": "#ffb596",
                    "warning-amber": "#F59E0B",
                    "outline": "#8d90a0",
                    "info-cyan": "#06B6D4",
                    "error": "#ffb4ab",
                    "surface-container-high": "#222a3d",
                    "on-secondary": "#003824",
                    "surface-variant": "#2d3449",
                    "on-secondary-fixed-variant": "#005236",
                    "inverse-on-surface": "#283044"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "gutter": "16px",
                    "base": "4px",
                    "max-width": "1280px"
            },
            "fontFamily": {
                    "headline-lg": ["Manrope"],
                    "headline-md": ["Manrope"],
                    "body-lg": ["Inter"],
                    "mono-data": ["JetBrains Mono"],
                    "label-caps": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 1080px;
            width: 1920px;
            margin: 0 auto;
            position: relative;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4);
            border-color: #2563eb;
        }

        @keyframes subtle-drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -40px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, rgba(11, 19, 38, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: subtle-drift 20s ease-in-out infinite;
            pointer-events: none;
        }

        .smooth-bg {
            background: radial-gradient(circle at center, #131b2e 0%, #0b1326 100%);
        }
    </style>
</head>
<body class="smooth-bg flex flex-col justify-center items-center">
<!-- Ambient backgrounds for 1080p spread -->
<div class="bg-glow top-[-100px] left-[-100px]"></div>
<div class="bg-glow bottom-[-100px] right-[-100px]" style="animation-delay: -10s; background: radial-gradient(circle, rgba(78, 222, 163, 0.05) 0%, rgba(11, 19, 38, 0) 70%);"></div>
<div class="bg-glow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="width: 1000px; height: 1000px; opacity: 0.3;"></div>
<main class="w-full max-w-[440px] flex flex-col items-center z-10">
<!-- Logo Section - Refined Size -->
<div class="mb-12 flex flex-col items-center space-y-5">
<div class="w-20 h-20 bg-primary-container rounded-2xl flex items-center justify-center shadow-[0_0_40px_rgba(37,99,235,0.3)] transform transition-transform hover:scale-105 duration-300">
<span class="material-symbols-outlined text-on-primary-container !text-5xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-md text-[28px] text-primary tracking-tight font-extrabold uppercase">Sentinela</h1>
</div>
<!-- Login Card - Perfected Centering & Depth -->
<div class="glass-panel w-full p-10 rounded-[2rem] flex flex-col space-y-8">
<div class="text-center space-y-2">
<h2 class="font-headline-md text-3xl text-on-surface font-bold">Entrar</h2>
<p class="font-body-sm text-body-lg text-on-surface-variant opacity-80">Gerencie suas chaves com segurança total.</p>
</div>
<form class="space-y-6" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-3">
<label class="font-label-caps text-[11px] text-on-surface-variant block uppercase tracking-[0.2em] font-bold px-1" for="email">E-mail Corporativo</label>
<div class="relative group input-focus-ring rounded-xl transition-all border border-outline-variant/30 overflow-hidden">
<input class="w-full bg-surface-container/50 border-none text-on-surface rounded-xl px-5 py-4 focus:ring-0 transition-colors placeholder:text-outline/50 text-body-lg" id="email" placeholder="nome@empresa.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-[11px] text-on-surface-variant block uppercase tracking-[0.2em] font-bold" for="password">Senha</label>
<a class="text-[11px] font-bold text-primary hover:text-white transition-all uppercase tracking-wider" href="#">Esqueceu?</a>
</div>
<div class="relative group input-focus-ring rounded-xl transition-all border border-outline-variant/30 overflow-hidden">
<input class="w-full bg-surface-container/50 border-none text-on-surface rounded-xl px-5 py-4 focus:ring-0 transition-colors placeholder:text-outline/50 font-mono-data text-body-lg" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none p-2" id="togglePassword" type="button">
<span class="material-symbols-outlined !text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button - Premium Shadow -->
<button class="w-full bg-primary-container hover:bg-blue-500 text-white font-extrabold py-4 px-6 rounded-xl transition-all transform active:scale-[0.97] flex items-center justify-center space-x-3 shadow-[0_10px_25px_-5px_rgba(37,99,235,0.4)] hover:shadow-[0_15px_30px_-5px_rgba(37,99,235,0.5)] group" type="submit">
<span class="material-symbols-outlined !text-xl group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">login</span>
<span class="text-lg">Acessar Sistema</span>
</button>
</form>
<!-- Access Notice -->
<div class="pt-6 border-t border-white/5 text-center">
<div class="flex items-center justify-center space-x-3 bg-white/5 py-3 px-4 rounded-xl border border-white/5">
<span class="material-symbols-outlined text-warning-amber !text-[18px]">info</span>
<p class="text-[12px] font-semibold leading-tight text-on-surface-variant">Acesso restrito a usuários autorizados.</p>
</div>
</div>
</div>
<!-- Additional Links -->
<div class="mt-10 flex flex-col items-center">
<div class="flex space-x-8">
<a class="font-label-caps text-[11px] text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest font-bold" href="#">Suporte</a>
<a class="font-label-caps text-[11px] text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest font-bold" href="#">Termos</a>
<a class="font-label-caps text-[11px] text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest font-bold" href="#">Privacidade</a>
</div>
</div>
</main>
<!-- App Version Footer - Absolute Bottom -->
<footer class="absolute bottom-10 left-0 right-0 flex justify-center">
<div class="flex items-center space-x-3 text-outline/40 font-mono-data text-[10px] tracking-[0.3em] uppercase bg-black/10 px-6 py-2 rounded-full border border-white/5 backdrop-blur-sm">
<span class="material-symbols-outlined !text-[14px]">verified_user</span>
<span>Sentinela Secure Engine v2.4.0-stable</span>
</div>
</footer>
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleButton.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
            
            toggleButton.classList.add('scale-90');
            setTimeout(() => toggleButton.classList.remove('scale-90'), 100);
        });

        // Form Submission Micro-interaction
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            const originalShadow = "shadow-[0_10px_25px_-5px_rgba(37,99,235,0.4)]";
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin !text-xl">progress_activity</span><span>Autenticando...</span>`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined !text-xl">error</span><span>Credenciais Inválidas</span>`;
                btn.classList.replace('bg-primary-container', 'bg-error-container');
                btn.classList.replace(originalShadow, 'shadow-[0_10px_25px_-5px_rgba(147,0,10,0.4)]');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-error-container', 'bg-primary-container');
                    btn.classList.replace('shadow-[0_10px_25px_-5px_rgba(147,0,10,0.4)]', originalShadow);
                }, 2000);
            }, 1500);
        });

        // Dynamic background atmosphere
        document.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;
            
            const glows = document.querySelectorAll('.bg-glow');
            glows.forEach((glow, index) => {
                const speed = (index + 1) * 30;
                const x = (mouseX * speed);
                const y = (mouseY * speed);
                glow.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body></html>
