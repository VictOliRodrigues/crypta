<style>
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes rotateSpinner {
            to { transform: rotate(360deg); }
        }
        .animate-fade-in {
            animation: fadeInScale 0.8s ease-out forwards;
        }
        .animate-pulse-soft {
            animation: pulseSoft 2s infinite ease-in-out;
        }
        .animate-rotate {
            animation: rotateSpinner 1.2s linear infinite;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-overflow-hidden items-center justify-center m-0">
<!-- Splash Screen Container -->
<main class="relative w-full h-screen flex flex-col items-center justify-between py-12 px-6">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-primary rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary-container rounded-full blur-[100px]"></div>
</div>
<!-- Hidden Spacer for Top Alignment -->
<div class="h-8"></div>
<!-- Central Branding Section -->
<div class="flex flex-col items-center justify-center animate-fade-in space-y-6">
<!-- Icon Container with Tonal Layering -->
<div class="relative w-24 h-24 flex items-center justify-center bg-surface-container rounded-full border border-outline-variant shadow-lg mb-4">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="security" style="font-variation-settings: 'FILL' 1;">
                    security
                </span>
<!-- Subtle Inner Glow -->
<div class="absolute inset-0 rounded-full border border-primary/20 animate-pulse-soft"></div>
</div>
<!-- Identity -->
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-1">
                    Sentinela
                </h1>
<p class="font-label-caps text-label-caps text-primary tracking-[0.2em] opacity-80 uppercase">
                    SECURE VAULT
                </p>
</div>
<!-- Loading Indicator -->
<div class="pt-8">
<div class="w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-rotate"></div>
</div>
</div>
<!-- App Metadata Footer -->
<footer class="flex flex-col items-center space-y-4">
<div class="flex items-center space-x-2 text-on-surface-variant/60 font-mono-data text-mono-data">
<span class="material-symbols-outlined text-[14px]" data-icon="verified_user">verified_user</span>
<span>End-to-End Encrypted</span>
</div>
<div class="font-mono-data text-mono-data text-on-surface-variant/40">
                v1.0.0
            </div>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        // Simulate a smooth transition out after a delay (UX best practice for splash screens)
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Sentinela Splash Screen Loaded');
