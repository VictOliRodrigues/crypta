<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Manrope:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-nav-pill {
            font-variation-settings: 'FILL' 1;
        }
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#003824",
                        "on-error": "#690005",
                        "danger-red": "#EF4444",
                        "secondary": "#4edea3",
                        "secondary-fixed": "#6ffbbe",
                        "surface-bright": "#31394d",
                        "error-container": "#93000a",
                        "surface-container-low": "#131b2e",
                        "surface-variant": "#2d3449",
                        "surface-container-highest": "#2d3449",
                        "tertiary-fixed-dim": "#ffb596",
                        "tertiary-fixed": "#ffdbcd",
                        "on-surface": "#dae2fd",
                        "on-secondary-fixed": "#002113",
                        "tertiary": "#ffb596",
                        "info-cyan": "#06B6D4",
                        "inverse-primary": "#0053db",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-lowest": "#060e20",
                        "warning-amber": "#F59E0B",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",
                        "on-error-container": "#ffdad6",
                        "slate-surface": "#1E293B",
                        "primary": "#b4c5ff",
                        "surface-container-high": "#222a3d",
                        "outline": "#8d90a0",
                        "surface-container": "#171f33",
                        "on-primary-fixed": "#00174b",
                        "secondary-container": "#00a572",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-dim": "#0b1326",
                        "on-primary-container": "#eeefff",
                        "on-tertiary": "#581e00",
                        "on-secondary-container": "#00311f",
                        "tertiary-container": "#bc4800",
                        "on-background": "#dae2fd",
                        "error": "#ffb4ab",
                        "inverse-surface": "#dae2fd",
                        "surface-tint": "#b4c5ff",
                        "on-surface-variant": "#c3c6d7",
                        "background": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "outline-variant": "#434655",
                        "surface": "#0b1326",
                        "secondary-fixed-dim": "#4edea3",
                        "on-primary": "#002a78",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-container": "#ffede6",
                        "primary-container": "#2563eb",
                        "graphite-deep": "#020617"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "max-width": "1280px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "mono-data": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Manrope"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen bg-background text-on-background">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant w-full top-0 flex justify-between items-center px-margin-mobile h-16 w-full fixed z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="security">security</span>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Sentinela</h1>
</div>
<button class="hover:bg-surface-variant transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16 pb-20">
<div class="max-w-xs w-full text-center space-y-6 animate-in fade-in duration-700">
<!-- Empty State Illustration/Icon -->
<div class="relative mx-auto w-32 h-32 flex items-center justify-center bg-surface-container-high rounded-full overflow-hidden">
<div class="absolute inset-0 opacity-10 bg-gradient-to-tr from-primary to-secondary"></div>
<span class="material-symbols-outlined text-primary text-6xl" data-icon="lock" style="font-variation-settings: 'wght' 300;">lock</span>
<!-- Decorative pulse effect -->
<div class="absolute inset-0 rounded-full border-2 border-primary/20 animate-ping opacity-25"></div>
</div>
<!-- Empty State Text -->
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Nenhum cofre encontrado</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Comece criando um espaço seguro para suas senhas.</p>
</div>
<!-- Hint or Primary CTA Link (Subtle) -->
<div class="pt-4">
<button class="font-label-caps text-label-caps text-primary hover:underline uppercase tracking-widest">
                    Saiba mais sobre segurança
                </button>
</div>
</div>
</main>
<!-- Floating Action Button (FAB) -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-secondary-container text-on-secondary-container rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-transform z-50 hover:bg-secondary hover:text-on-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center pb-safe bg-surface-container dark:bg-surface-container border-t border-outline-variant fixed bottom-0 w-full z-50 h-20">
<!-- Item: Cofres (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined active-nav-pill" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-caps text-label-caps mt-0.5">Cofres</span>
</a>
<!-- Item: Convites -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright p-2 rounded-full active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-caps text-label-caps mt-0.5">Convites</span>
</a>
<!-- Item: Conta -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright p-2 rounded-full active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-0.5">Conta</span>
</a>
</nav>
<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', (e) => {
                // Prevent default for demo
                if(el.tagName === 'A') e.preventDefault();
                
                // Haptic feedback simulation (console only)
                console.log('Action triggered');
            });
        });
    </script>
</body></html>
