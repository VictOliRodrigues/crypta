<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sentinela - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Manrope:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed": "#00174b",
                    "surface-container-high": "#222a3d",
                    "on-surface-variant": "#c3c6d7",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "surface-container-highest": "#2d3449",
                    "warning-amber": "#F59E0B",
                    "surface-container": "#171f33",
                    "tertiary": "#ffb596",
                    "info-cyan": "#06B6D4",
                    "on-secondary-fixed": "#002113",
                    "on-surface": "#dae2fd",
                    "on-tertiary": "#581e00",
                    "on-secondary-fixed-variant": "#005236",
                    "danger-red": "#EF4444",
                    "inverse-surface": "#dae2fd",
                    "surface-variant": "#2d3449",
                    "primary-fixed-dim": "#b4c5ff",
                    "tertiary-fixed-dim": "#ffb596",
                    "secondary": "#4edea3",
                    "slate-surface": "#1E293B",
                    "primary-fixed": "#dbe1ff",
                    "on-primary": "#002a78",
                    "background": "#0b1326",
                    "secondary-fixed": "#6ffbbe",
                    "graphite-deep": "#020617",
                    "surface": "#0b1326",
                    "on-tertiary-fixed": "#360f00",
                    "surface-dim": "#0b1326",
                    "secondary-fixed-dim": "#4edea3",
                    "on-tertiary-container": "#ffede6",
                    "inverse-primary": "#0053db",
                    "tertiary-fixed": "#ffdbcd",
                    "tertiary-container": "#bc4800",
                    "primary": "#b4c5ff",
                    "on-secondary-container": "#00311f",
                    "inverse-on-surface": "#283044",
                    "primary-container": "#2563eb",
                    "surface-tint": "#b4c5ff",
                    "surface-container-low": "#131b2e",
                    "surface-container-lowest": "#060e20",
                    "error": "#ffb4ab",
                    "on-primary-container": "#eeefff",
                    "on-primary-fixed-variant": "#003ea8",
                    "outline": "#8d90a0",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "outline-variant": "#434655",
                    "surface-bright": "#31394d",
                    "on-background": "#dae2fd",
                    "on-secondary": "#003824",
                    "secondary-container": "#00a572",
                    "on-error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "max-width": "1280px",
                    "margin-desktop": "32px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "mono-data": ["JetBrains Mono"],
                    "headline-md": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .password-field:focus-within {
            outline: 2px solid #b4c5ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top Glow Effect -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-64 bg-primary/10 blur-[120px] rounded-full -z-10"></div>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile w-full max-w-md mx-auto py-12">
<!-- Header Section -->
<header class="text-center mb-12">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-high rounded-xl border border-outline-variant mb-6 shadow-2xl">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-1">Sentinela</h1>
<p class="font-label-caps text-label-caps text-primary tracking-[0.2em]">SECURE VAULT</p>
</header>
<!-- Form Section -->
<section class="w-full space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="email">E-MAIL</label>
<div class="relative">
<input autocomplete="email" class="w-full h-14 bg-surface-container-low border border-outline-variant rounded-lg px-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" placeholder="usuario@empresa.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1" for="password">SENHA</label>
<div class="relative flex items-center bg-surface-container-low border border-outline-variant rounded-lg transition-all focus-within:ring-2 focus-within:ring-primary focus-within:border-transparent h-14">
<input autocomplete="current-password" class="flex-grow bg-transparent border-none px-4 font-mono-data text-mono-data text-on-surface placeholder:text-outline focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="p-4 text-on-surface-variant hover:text-on-surface transition-colors active:scale-90" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform flex items-center justify-center mt-4" onclick="handleLogin()">
                Entrar
            </button>
<!-- Invitation Note -->
<div class="flex items-center justify-center space-x-2 pt-4 opacity-70">
<span class="material-symbols-outlined text-[18px]">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant italic">
                    O acesso a esta plataforma é exclusivo por convite.
                </p>
</div>
</section>
</main>
<!-- Footer Section -->
<footer class="w-full py-8 text-center mt-auto">
<p class="font-mono-data text-mono-data text-outline opacity-50">v1.0.0</p>
</footer>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerText = 'visibility';
            }
        }

        function handleLogin() {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            
            // Basic UI feedback for button press
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Verificando...
            `;

            // Simulate network delay
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                alert('Sentinela: Autenticação iniciada. Verifique suas credenciais.');
            }, 1500);
        }

        // Apply dark mode immediately
        document.documentElement.classList.add('dark');
    </script>
</body></html>
