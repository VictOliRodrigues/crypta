<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant w-full top-0 z-50 fixed">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:opacity-80 transition-colors p-2 -ml-2">

</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Work Project</h1>
</div>
<button class="hover:bg-surface-variant transition-colors active:opacity-80 p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-20 overflow-y-auto px-margin-mobile pt-6 max-w-screen-md mx-auto w-full">
<!-- Vault Summary Section -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-5 mb-6">
<div class="flex flex-col gap-2">
<p class="font-body-lg text-body-lg text-on-surface">Credentials for Project Phoenix</p>
<div class="flex flex-wrap gap-3 mt-2">
<div class="flex items-center gap-1.5 px-3 py-1 bg-secondary-container text-on-secondary-container rounded-full">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">group</span>
<span class="font-label-caps text-label-caps">8 Members</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container-highest text-on-surface rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">verified_user</span>
<span class="font-label-caps text-label-caps">Editor</span>
</div>
</div>
</div>
</section>
<!-- Search Bar -->
<div class="relative mb-6">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full bg-surface-container-high border border-outline-variant text-on-surface rounded-full py-3 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-surface-variant/50 font-body-sm text-body-sm" placeholder="Search for site or user" type="text"/>
</div>
<!-- Site Items List -->
<div class="space-y-3 pb-8">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest px-1">Sites</h2>
<!-- Site Item: Google -->
<button class="w-full text-left bg-surface-container rounded-xl p-4 border border-outline-variant hover:bg-surface-bright transition-colors active:scale-[0.98] transition-transform group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">public</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<h3 class="font-headline-md text-body-lg font-semibold text-on-surface truncate">Google</h3>
<span class="font-label-caps text-[10px] text-on-surface-variant opacity-70">2h ago</span>
</div>
<p class="font-mono-data text-body-sm text-on-surface-variant truncate">accounts.google.com</p>
<p class="font-label-caps text-label-caps text-secondary mt-1">12 credentials</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</div>
</button>
<!-- Site Item: AWS -->
<button class="w-full text-left bg-surface-container rounded-xl p-4 border border-outline-variant hover:bg-surface-bright transition-colors active:scale-[0.98] transition-transform group">

</div>

<h3 class="font-headline-md text-body-lg font-semibold text-on-surface truncate">AWS</h3>
<span class="font-label-caps text-[10px] text-on-surface-variant opacity-70">5h ago</span>
</div>
<p class="font-mono-data text-body-sm text-on-surface-variant truncate">console.aws.amazon.com</p>
<p class="font-label-caps text-label-caps text-secondary mt-1">4 credentials</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</div>
</button>

<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center flex-shrink-0">

</button>

<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center flex-shrink-0">

</div>

</button>

<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps">Conta</span>
</button>

<script>
        // Simple micro-interaction for list items
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.7';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
        
        // Dynamic search highlighting (UI only)
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
</body></html>
