name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - staging
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tipos, testes e builds
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          # Este job não executa nenhuma operação git depois do checkout, mas
          # roda `pnpm install`, que executa scripts de instalação de terceiros
          # (ver `allowBuilds` em pnpm-workspace.yaml). Sem isto, o token do job
          # fica legível no filesystem do runner durante essa janela.
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Precisa vir antes de typecheck e testes: as aplicações consomem os
      # packages compartilhados pelo `dist` publicado no workspace, não pelo
      # código-fonte. Em um clone limpo esse `dist` não existe, e tanto o
      # typecheck quanto os testes da API falhariam por módulo não encontrado.
      - name: Construir packages compartilhados
        run: pnpm build:packages

      - name: Validar formatação
        run: pnpm format:check

      - name: Executar lint
        run: pnpm lint

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Construir aplicações
        run: pnpm build

      # O schema é a fonte das migrations; um schema inválido só apareceria no
      # deploy, quando `prisma migrate deploy` roda.
      - name: Validar schema do Prisma
        env:
          # `prisma validate` resolve o datasource antes de validar o schema e
          # falha com P1012 se a variável não existir. Nenhuma conexão é aberta
          # neste passo: o valor é um placeholder descartável, não configuração
          # de ambiente, e não deve ser reaproveitado em lugar nenhum.
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/placeholder
        run: pnpm --filter @crypta/api run prisma:validate

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          # Este job não executa nenhuma operação git depois do checkout, mas
          # roda `pnpm install`, que executa scripts de instalação de terceiros
          # (ver `allowBuilds` em pnpm-workspace.yaml). Sem isto, o token do job
          # fica legível no filesystem do runner durante essa janela.
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Este projeto armazena credenciais: uma vulnerabilidade alta em
      # dependência bloqueia o merge (ROADMAP.md secao 42).
      - name: Auditar vulnerabilidades
        run: pnpm audit --audit-level high

  integration:
    name: Testes de integração com MySQL
    runs-on: ubuntu-latest

    # SQLite não é substituto aceitável: o schema depende de comportamento
    # específico do MySQL, incluindo a collation utf8mb4_0900_ai_ci que a
    # migration fixa à mão (CLAUDE.md secao 42, DATABASE.md secao 3).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: crypta_ci
          MYSQL_DATABASE: crypta_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcrypta_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          # Mesmo motivo do job `validate`: `pnpm install` executa scripts de
          # terceiros, e sem isto o token do job fica legível no filesystem do
          # runner durante essa janela.
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # A API resolve `@crypta/*` pelo `dist` publicado no workspace, não pelo
      # código-fonte. Em um clone limpo esse `dist` não existe.
      - name: Construir packages compartilhados
        run: pnpm build:packages

      # O mesmo comando que o entrypoint do container roda em cada ambiente
      # (ADR 0015). Se a migration falhar aqui, ela falharia no deploy.
      - name: Aplicar migrations
        env:
          DATABASE_URL: mysql://root:crypta_ci@127.0.0.1:3306/crypta_test
        run: pnpm --filter @crypta/api run prisma:migrate:deploy

      # A senha do MySQL de CI é descartável e vive só neste job. Ela não é
      # secret porque não protege nada: o serviço só existe durante o run e não
      # é alcançável de fora do runner.
      - name: Executar testes de integração
        env:
          TEST_DATABASE_URL: mysql://root:crypta_ci@127.0.0.1:3306/crypta_test
        run: pnpm --filter @crypta/api test:e2e
