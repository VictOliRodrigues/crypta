version: 2

updates:
  # Dependências do monorepo. `develop` é a branch padrão e o único destino
  # permitido para chore/* (GITHUB_RELEASE_FLOW.md secao 5).
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Agrupar patches reduz ruído sem esconder atualização relevante.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Bibliotecas de criptografia, autenticação e parsing exigem revisão
      # manual (STYLE_GUIDE.md secao 61). Elas não entram em grupo automático.
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
      - security
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: docker
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: 'build(deps)'
