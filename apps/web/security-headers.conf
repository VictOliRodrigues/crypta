# Cabeçalhos de segurança da aplicação Web (ARCHITECTURE.md secao 35).
#
# ESTE ARQUIVO PRECISA SER INCLUÍDO EM TODO `location` DO `default.conf`.
#
# O nginx herda `add_header` de um nível para o outro apenas quando o nível
# atual não declara nenhum `add_header` próprio. Um único `add_header` dentro
# de um `location` — `Cache-Control`, por exemplo — descarta silenciosamente
# todos os cabeçalhos definidos no `server`.
#
# Foi o que aconteceu antes desta separação: `location = /index.html` e
# `location /assets/` definiam `Cache-Control`, e com isso a SPA e todo o
# bundle eram servidos sem CSP, sem X-Frame-Options e sem os demais. Como todo
# carregamento real é o index ou um asset, na prática nenhum cabeçalho de
# segurança chegava ao navegador.
#
# A CSP é restritiva de propósito: a Web é o ponto onde as chaves são
# derivadas e o conteúdo é descriptografado. Um script de terceiro nesta
# página teria acesso a tudo que o usuário abriu (ARCHITECTURE.md 48.1).
#
# `connect-src` precisa listar a origem da API de cada ambiente; ajuste ao
# provisionar os domínios (config_user.md).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
