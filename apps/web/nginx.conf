# Configuração do Nginx que serve a SPA.
#
# O proxy reverso do Coolify termina o TLS e adiciona HSTS; aqui ficam apenas
# os cabeçalhos que dependem do conteúdo servido.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não revelar a versão do Nginx.
    server_tokens off;

    # --- Cabeçalhos de segurança (ARCHITECTURE.md secao 35) ---------------
    #
    # A CSP é restritiva de propósito: a Web é o ponto onde as chaves são
    # derivadas e o conteúdo é descriptografado. Um script de terceiro nesta
    # página teria acesso a tudo que o usuário abriu (ARCHITECTURE.md 48.1).
    #
    # `connect-src` precisa listar a origem da API de cada ambiente; ajuste ao
    # provisionar os domínios (config_user.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # O index.html nunca pode ser cacheado: é ele que aponta para o bundle da
    # versão implantada. Um index em cache serviria a versão antiga depois de
    # um deploy ou de um rollback.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fallback de SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
