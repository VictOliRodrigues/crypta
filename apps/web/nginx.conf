# Configuração do Nginx que serve a SPA.
#
# O proxy reverso do Coolify termina o TLS e adiciona HSTS; aqui ficam apenas
# os cabeçalhos que dependem do conteúdo servido.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não revelar a versão do Nginx.
    server_tokens off;

    # --- Cabeçalhos de segurança (ARCHITECTURE.md secao 35) ---------------
    #
    # INVARIANTE: o include abaixo precisa ser repetido em TODO `location`
    # deste arquivo. O nginx só herda `add_header` quando o nível atual não
    # declara nenhum; um `add_header Cache-Control` dentro de um `location`
    # descarta todos os cabeçalhos de segurança do `server`. O motivo completo
    # está em security-headers.conf, e o teste que protege a regra está em
    # src/test/nginx-config.test.ts.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # O index.html nunca pode ser cacheado: é ele que aponta para o bundle da
    # versão implantada. Um index em cache serviria a versão antiga depois de
    # um deploy ou de um rollback.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control "no-store" always;
    }

    # Fallback de SPA: qualquer rota desconhecida devolve o index.
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        try_files $uri $uri/ /index.html;
    }
}
